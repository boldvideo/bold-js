name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run linter
        run: pnpm run lint
      
      - name: Build and test package
        run: pnpm test
      
      - name: Check package exports
        run: |
          node -e "const pkg = require('./dist/index.cjs'); console.log('CJS import successful');"
          node -e "import('./dist/index.js').then(() => console.log('ESM import successful'));"
      
      - name: Check TypeScript declarations
        run: |
          if [ ! -f "dist/index.d.ts" ]; then
            echo "TypeScript declarations not found!"
            exit 1
          fi

  player:
    name: Player package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, test and build
        working-directory: packages/player
        run: |
          pnpm run lint
          pnpm test
          pnpm run build

  assistant:
    name: Assistant package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK declarations for compatibility checks
        run: pnpm run build
      - name: Typecheck, test and build
        working-directory: packages/assistant
        run: |
          pnpm run lint
          pnpm exec vitest run --coverage
          pnpm run build
          node --input-type=module -e 'await Promise.all(["@boldvideo/assistant", ...["core", "server", "testing"].map(entry => "@boldvideo/assistant/" + entry)].map(entry => import(entry))); console.log("All assistant entry points imported")'

  size-check:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build package
        run: pnpm run build
      
      - name: Check bundle size
        run: |
          echo "Bundle sizes:"
          ls -lh dist/

          # Warn if bundle exceeds 50KB (adjust threshold as needed)
          size=$(node -e "console.log(require('fs').statSync('dist/index.js').size)")
          if [ $size -gt 51200 ]; then
            echo "⚠️  Warning: Bundle size exceeds 50KB (current: ${size} bytes)"
          else
            echo "✅ Bundle size OK: ${size} bytes"
          fi
